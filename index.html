<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Persediaan Barang | PT Eclo Mega Nusantara</title><style>
:root{font-family:Arial,sans-serif;color:#172b4d;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:#0758c9;color:white}button.secondary{background:#e7effb;color:#123c79}button.danger{background:#d93443}.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.hero{background:linear-gradient(145deg,#073b84,#071c42);color:white;padding:12%;display:flex;flex-direction:column;justify-content:center}.hero h1{font-size:42px}.loginform{display:flex;justify-content:center;align-items:center;padding:30px}.panel{background:white;padding:30px;border-radius:16px;box-shadow:0 6px 28px #16345a15;width:100%;max-width:450px}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}input,select{padding:11px;border:1px solid #cbd5e1;border-radius:8px;width:100%;background:white}.app{display:none;min-height:100vh}.sidebar{background:#082f6d;color:white;width:235px;padding:22px 14px;flex-shrink:0}.sidebar h3{padding:0 12px;line-height:1.4}.nav{width:100%;display:block;text-align:left;background:transparent;margin:5px 0}.nav.active,.nav:hover{background:#1164d8}.main{flex:1;min-width:0}.top{background:white;padding:20px 30px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e3e9f1}.content{padding:30px;max-width:1300px;margin:auto}.cards{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:16px}.card{background:white;border-radius:12px;padding:20px;box-shadow:0 3px 16px #12284a10}.card strong{font-size:30px;display:block;margin-top:12px;color:#0758c9}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}.toolbar input{max-width:320px}.tablewrap{overflow-x:auto;background:white;border-radius:12px}table{width:100%;border-collapse:collapse}th,td{padding:13px;text-align:left;border-bottom:1px solid #e7ecf3;white-space:nowrap}th{background:#edf3fb}.small{padding:6px 9px;font-size:13px;margin-right:4px}.muted{color:#61738a}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notice{padding:12px;border-radius:8px;background:#e8f7ec;color:#176d31;margin:14px 0}.hidden{display:none!important}@media(max-width:800px){.login{grid-template-columns:1fr}.hero{padding:25px}.hero h1{font-size:28px}.app{flex-direction:column}.sidebar{width:100%}.cards,.grid2,.formgrid{grid-template-columns:1fr}.top,.content{padding:16px}}
</style></head><body><section class="login" id="login"><div class="hero"><h1>PT Eclo Mega Nusantara</h1><h2>Sistem Informasi Manajemen Persediaan Barang</h2><p>Prototype interaktif UI/UX • DUX-6</p></div><div class="loginform"><div class="panel"><h2>Masuk ke Sistem</h2><p class="muted">Demo: masukkan username dan password apa saja.</p><form id="loginForm"><label class="field">Username<input required id="username" placeholder="Username"></label><label class="field">Password<input required type="password" placeholder="Password"></label><button style="width:100%">Masuk</button></form></div></div></section><div class="app" id="app"><aside class="sidebar"><h3>◈ PT Eclo Mega Nusantara</h3><button class="nav active" data-page="dashboard">⌂ Dashboard</button><button class="nav" data-page="barang">▤ Data Barang</button><button class="nav" data-page="masuk">↥ Barang Masuk</button><button class="nav" data-page="keluar">↧ Barang Keluar</button><button class="nav" data-page="laporan">▣ Laporan Persediaan</button><button class="nav" id="logout">Keluar</button></aside><div class="main"><header class="top"><b id="pageTitle">Dashboard</b><span>Admin Demo • PT Eclo Mega Nusantara</span></header><main class="content"><div id="notice"></div><div id="view"></div></main></div></div><script>
const seed=[{code:'BRG-001',name:'Kertas A4',cat:'ATK',stock:120,unit:'Rim'},{code:'BRG-002',name:'Tinta Printer',cat:'ATK',stock:35,unit:'Pcs'},{code:'BRG-003',name:'Mouse',cat:'Perangkat IT',stock:28,unit:'Pcs'},{code:'BRG-004',name:'Keyboard',cat:'Perangkat IT',stock:24,unit:'Pcs'},{code:'BRG-005',name:'Monitor',cat:'Perangkat IT',stock:15,unit:'Unit'}];let items=JSON.parse(localStorage.getItem('dux6_items')||'null')||seed;let history=JSON.parse(localStorage.getItem('dux6_history')||'[]');let page='dashboard';const $=id=>document.getElementById(id);function persist(){localStorage.setItem('dux6_items',JSON.stringify(items));localStorage.setItem('dux6_history',JSON.stringify(history))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function notify(s){$('notice').innerHTML='<div class="notice">'+esc(s)+'</div>';setTimeout(()=>$('notice').innerHTML='',3500)}function nav(p){page=p;document.querySelectorAll('.nav[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===p));$('pageTitle').textContent={dashboard:'Dashboard',barang:'Data Barang',masuk:'Barang Masuk',keluar:'Barang Keluar',laporan:'Laporan Persediaan'}[p];render()};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>nav(b.dataset.page));$('loginForm').onsubmit=e=>{e.preventDefault();$('login').style.display='none';$('app').style.display='flex';nav('dashboard')};$('logout').onclick=()=>{$('app').style.display='none';$('login').style.display='grid'};function table(rows,heads){return '<div class="tablewrap"><table><thead><tr>'+heads.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>'}function render(){let total=items.reduce((a,x)=>a+x.stock,0), ins=history.filter(x=>x.type==='Masuk').reduce((a,x)=>a+x.qty,0),outs=history.filter(x=>x.type==='Keluar').reduce((a,x)=>a+x.qty,0);if(page==='dashboard'){$('view').innerHTML='<h1>Selamat datang di Dashboard</h1><p class="muted">Ringkasan data prototype persediaan barang</p><div class="cards">'+[['Jenis Barang',items.length],['Total Stok',total],['Barang Masuk',ins],['Barang Keluar',outs]].map(x=>'<div class="card">'+x[0]+'<strong>'+x[1]+'</strong></div>').join('')+'</div><div class="card" style="margin-top:20px"><h3>Stok Menipis (≤ 10)</h3>'+(items.filter(x=>x.stock<=10).map(x=>'<p>'+esc(x.name)+' — '+x.stock+'</p>').join('')||'<p class="muted">Tidak ada stok menipis.</p>')+'</div>'}if(page==='barang')renderBarang();if(page==='masuk'||page==='keluar')renderTransaksi();if(page==='laporan')renderLaporan()}
function renderBarang(){let q=window.searchQuery||'';let rows=items.filter(x=>(x.name+' '+x.code).toLowerCase().includes(q.toLowerCase())).map(x=>'<tr><td>'+esc(x.code)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.cat)+'</td><td>'+x.stock+'</td><td>'+esc(x.unit)+'</td><td><button class="small secondary" onclick="editBarang(\''+esc(x.code)+'\')">Edit</button><button class="small danger" onclick="deleteBarang(\''+esc(x.code)+'\')">Hapus</button></td></tr>');$('view').innerHTML='<h1>Data Barang</h1><div class="toolbar"><input id="search" placeholder="Cari nama atau kode barang..." value="'+esc(q)+'"><button onclick="editBarang()">+ Tambah Barang</button></div><div id="editor"></div>'+table(rows,['Kode','Nama Barang','Kategori','Stok','Satuan','Aksi']);$('search').oninput=e=>{window.searchQuery=e.target.value;renderBarang();$('search').focus();$('search').setSelectionRange(window.searchQuery.length,window.searchQuery.length)}}window.deleteBarang=code=>{if(confirm('Hapus barang '+code+'?')){items=items.filter(x=>x.code!==code);persist();renderBarang();notify('Barang dihapus')}};window.editBarang=code=>{let x=items.find(a=>a.code===code)||{code:'',name:'',cat:'ATK',stock:0,unit:'Pcs'};$('editor').innerHTML='<div class="card"><h3>'+(code?'Edit':'Tambah')+' Barang</h3><form id="itemForm" class="formgrid"><label class="field">Kode<input name="code" required '+(code?'readonly':'')+' value="'+esc(x.code)+'"></label><label class="field">Nama Barang<input name="name" required value="'+esc(x.name)+'"></label><label class="field">Kategori<input name="cat" required value="'+esc(x.cat)+'"></label><label class="field">Stok<input name="stock" type="number" min="0" required value="'+x.stock+'"></label><label class="field">Satuan<input name="unit" required value="'+esc(x.unit)+'"></label><div class="toolbar"><button>Simpan</button><button type="button" class="secondary" onclick="renderBarang()">Batal</button></div></form></div>';$('itemForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),v={code:f.get('code').trim(),name:f.get('name').trim(),cat:f.get('cat').trim(),stock:Number(f.get('stock')),unit:f.get('unit').trim()};if(!code&&items.some(a=>a.code===v.code))return alert('Kode barang sudah ada');if(code)items=items.map(a=>a.code===code?v:a);else items.push(v);persist();renderBarang();notify('Data barang disimpan')}};
function renderTransaksi(){let incoming=page==='masuk',kind=incoming?'Masuk':'Keluar',options=items.map(x=>'<option value="'+esc(x.code)+'">'+esc(x.code)+' — '+esc(x.name)+' (stok '+x.stock+')</option>').join('');$('view').innerHTML='<h1>Barang '+kind+'</h1><div class="card"><h3>Tambah Transaksi Barang '+kind+'</h3><form id="txForm" class="formgrid"><label class="field">Tanggal<input type="date" name="date" required value="'+new Date().toISOString().slice(0,10)+'"></label><label class="field">'+(incoming?'Pemasok':'Tujuan / Pengguna')+'<input name="party" required placeholder="'+(incoming?'Nama pemasok':'Nama tujuan')+'"></label><label class="field">Kode Barang<select name="code" required>'+options+'</select></label><label class="field">Jumlah<input name="qty" type="number" min="1" required></label><div><button>Simpan Transaksi</button></div></form></div><h3>Riwayat Barang '+kind+'</h3>'+table(history.filter(x=>x.type===kind).map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(x.code)+'</td><td>'+x.qty+'</td><td>'+esc(x.party)+'</td></tr>'),['Tanggal','Kode Barang','Jumlah',incoming?'Pemasok':'Tujuan']);$('txForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),code=f.get('code'),qty=Number(f.get('qty')),item=items.find(x=>x.code===code);if(!item)return alert('Pilih barang');if(!incoming&&item.stock<qty)return alert('Stok tidak mencukupi');item.stock+=incoming?qty:-qty;history.unshift({type:kind,date:f.get('date'),code,qty,party:f.get('party')});persist();renderTransaksi();notify('Transaksi tersimpan (data simulasi)')}}function renderLaporan(){let rows=items.map(x=>'<tr><td>'+esc(x.code)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.cat)+'</td><td>'+x.stock+'</td><td>'+esc(x.unit)+'</td></tr>');$('view').innerHTML='<h1>Laporan Persediaan</h1><p class="muted">Laporan stok terkini dari data simulasi.</p><div class="toolbar"><button onclick="exportCSV()">Ekspor CSV</button><button class="secondary" onclick="window.print()">Cetak / Simpan PDF</button></div>'+table(rows,['Kode','Nama Barang','Kategori','Stok Akhir','Satuan'])}window.exportCSV=()=>{let csv=[['Kode','Nama Barang','Kategori','Stok','Satuan'],...items.map(x=>[x.code,x.name,x.cat,x.stock,x.unit])].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='laporan-persediaan.csv';a.click();URL.revokeObjectURL(a.href)};
</script></body></html>
